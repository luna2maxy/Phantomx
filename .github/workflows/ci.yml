name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64-debug
            os: windows-latest
            preset: windows-msvc-debug
            build_type: Debug
          - name: windows-x64-release
            os: windows-latest
            preset: windows-msvc-release
            build_type: Release
          - name: linux-x86_64-debug
            os: ubuntu-latest
            preset: linux-gcc-debug
            build_type: Debug
          - name: linux-x86_64-release
            os: ubuntu-latest
            preset: linux-gcc-release
            build_type: Release
          - name: linux-arm64-debug
            os: ubuntu-24.04-arm
            preset: linux-gcc-debug
            build_type: Debug
          - name: linux-arm64-release
            os: ubuntu-24.04-arm
            preset: linux-gcc-release
            build_type: Release
          - name: macos-arm64-debug
            os: macos-14
            preset: macos-clang-debug
            build_type: Debug
          - name: macos-arm64-release
            os: macos-14
            preset: macos-clang-release
            build_type: Release
          - name: macos-intel-debug
            os: macos-15-intel
            preset: macos-clang-debug
            build_type: Debug
          - name: macos-intel-release
            os: macos-15-intel
            preset: macos-clang-release
            build_type: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsodium-dev libsqlite3-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja libsodium sqlite3

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja -y
          vcpkg install libsodium:x64-windows sqlite3:x64-windows

      - name: Setup MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
