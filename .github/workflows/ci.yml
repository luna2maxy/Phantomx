name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64-debug
            os: windows-latest
            preset: windows-msvc-debug
            build_type: Debug
          - name: windows-x64-release
            os: windows-latest
            preset: windows-msvc-release
            build_type: Release
          - name: linux-x86_64-debug
            os: ubuntu-latest
            preset: linux-gcc-debug
            build_type: Debug
          - name: linux-x86_64-release
            os: ubuntu-latest
            preset: linux-gcc-release
            build_type: Release
          - name: linux-arm64-debug
            os: ubuntu-24.04-arm
            preset: linux-gcc-debug
            build_type: Debug
          - name: linux-arm64-release
            os: ubuntu-24.04-arm
            preset: linux-gcc-release
            build_type: Release
          - name: macos-intel-debug
            os: macos-15-intel
            preset: macos-clang-debug
            build_type: Debug
          - name: macos-intel-release
            os: macos-15-intel
            preset: macos-clang-release
            build_type: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsodium-dev libsqlite3-dev libjansson-dev libcurl4-openssl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja libsodium sqlite3 jansson curl

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja -y
          vcpkg install libsodium:x64-windows sqlite3:x64-windows jansson:x64-windows curl:x64-windows

      - name: Setup MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The test framework's watchdog names the exact test if it hangs,
          # instead of leaving this job blocked for hours with no output.
          $env:PHX_TEST_TIMEOUT_MS = "180000"
          ctest --preset ${{ matrix.preset }} --output-on-failure --timeout 600

      - name: Test (Unix)
        if: runner.os != 'Windows'
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          OUT="dist/${{ matrix.name }}"
          mkdir -p "$OUT"
          BIN_DIR="build/${{ matrix.preset }}/bin"
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Windows core zip: executables only, no runtime DLLs or extra files.
            for exe in phantomxd phantomx-cli phantomx-poi phantomx-wallet phantomx-pool; do
              if [ -f "$BIN_DIR/$exe.exe" ]; then
                cp "$BIN_DIR/$exe.exe" "$OUT/"
              fi
            done
          elif [ -d "$BIN_DIR" ]; then
            cp -a "$BIN_DIR"/. "$OUT"/
          fi
          # Include key build outputs if present
          ls -la "$OUT" || true
          # Create a zip/tar for easy download
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "dist/${{ matrix.name }}.zip" "./$OUT/*"
          else
            tar -C dist -czf "dist/${{ matrix.name }}.tar.gz" "${{ matrix.name }}"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 14

  build-qt:
    name: qt-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64-release
            os: windows-latest
            preset: windows-msvc-release
          - name: linux-x86_64-release
            os: ubuntu-latest
            preset: linux-gcc-release
          - name: linux-arm64-release
            os: ubuntu-24.04-arm
            preset: linux-gcc-release
          - name: macos-intel-release
            os: macos-15-intel
            preset: macos-clang-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsodium-dev libsqlite3-dev libjansson-dev libcurl4-openssl-dev \
            libgl1-mesa-dev libxkbcommon-dev libxcb-xinerama0-dev libxcb-cursor-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja libsodium sqlite3 jansson curl

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja nsis -y
          vcpkg install libsodium:x64-windows sqlite3:x64-windows jansson:x64-windows curl:x64-windows

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Setup MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake --preset ${{ matrix.preset }} -DPHANTOMX_BUILD_QT=ON -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake --preset ${{ matrix.preset }} -DPHANTOMX_BUILD_QT=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Deploy Qt runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binDir = "build/${{ matrix.preset }}/bin"
          $exe = Join-Path $binDir "phantomx-qt.exe"
          if (-not (Test-Path $exe)) {
            throw "phantomx-qt.exe not found at $exe"
          }
          $stageDir = Join-Path $PWD "dist/qt-windows-stage"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item $exe $stageDir
          # Runtime DLLs produced by vcpkg applocal (libsodium, jansson, curl, sqlite3, ...).
          Copy-Item (Join-Path $binDir "*.dll") $stageDir -ErrorAction SilentlyContinue
          windeployqt --release --qmldir apps/phantomx-qt/qml --dir $stageDir (Join-Path $stageDir "phantomx-qt.exe")

      - name: Deploy Qt runtime (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          BIN_DIR="build/${{ matrix.preset }}/bin"
          APP="$BIN_DIR/phantomx-qt.app"
          if [ -d "$APP" ]; then
            macdeployqt "$APP" -qmldir=apps/phantomx-qt/qml -verbose=1
          elif [ -f "$BIN_DIR/phantomx-qt" ]; then
            macdeployqt "$BIN_DIR/phantomx-qt" -qmldir=apps/phantomx-qt/qml -verbose=1 || true
          fi

      - name: Package Qt installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stageDir = Join-Path $PWD "dist/qt-windows-stage"
          $outFile = Join-Path $PWD "dist/qt-${{ matrix.name }}-setup.exe"
          # NSIS is preinstalled on GitHub runners, but makensis is not always on
          # PATH (Chocolatey skips creating a shim when the package is already
          # present), so locate the executable explicitly.
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            $searchRoots = @(
              "C:\Program Files (x86)\NSIS",
              "C:\Program Files\NSIS",
              "C:\ProgramData\chocolatey\lib\nsis"
            )
            $makensis = Get-ChildItem -Path $searchRoots -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $makensis) {
            throw "makensis not found; install NSIS or add it to PATH"
          }
          & $makensis "/DSTAGE_DIR=$stageDir" "/DOUT_FILE=$outFile" "deploy\windows\phantomx-qt.nsi"
          if ($LASTEXITCODE -ne 0) {
            throw "makensis failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path $outFile)) {
            throw "Installer not produced: $outFile"
          }

      - name: Package Qt artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          OUT="dist/qt-${{ matrix.name }}"
          mkdir -p "$OUT"
          BIN_DIR="build/${{ matrix.preset }}/bin"
          if [ -d "$BIN_DIR" ]; then
            cp -a "$BIN_DIR"/. "$OUT"/
          fi
          ls -la "$OUT" || true
          tar -C dist -czf "dist/qt-${{ matrix.name }}.tar.gz" "qt-${{ matrix.name }}"

      - name: Upload Qt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qt-${{ matrix.name }}
          path: |
            dist/qt-${{ matrix.name }}.*
            dist/qt-${{ matrix.name }}-setup.exe
          if-no-files-found: error
          retention-days: 14

  artifacts-summary:
    name: artifacts-summary
    runs-on: ubuntu-latest
    needs: [build-test, build-qt]
    if: always()
    steps:
      - name: Write download summary
        shell: bash
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "## Build artifacts"
            echo ""
            echo "Download all build artifacts from this workflow run:"
            echo ""
            echo "- **Run page:** ${RUN_URL}"
            echo "- **Artifacts section:** ${RUN_URL}#artifacts"
            echo ""
            echo "### Core builds"
            echo ""
            echo "| Build | Artifact |"
            echo "|---|---|"
            echo "| windows-x64-debug | \`windows-x64-debug\` |"
            echo "| windows-x64-release | \`windows-x64-release\` |"
            echo "| linux-x86_64-debug | \`linux-x86_64-debug\` |"
            echo "| linux-x86_64-release | \`linux-x86_64-release\` |"
            echo "| linux-arm64-debug | \`linux-arm64-debug\` |"
            echo "| linux-arm64-release | \`linux-arm64-release\` |"
            echo "| macos-intel-debug | \`macos-intel-debug\` |"
            echo "| macos-intel-release | \`macos-intel-release\` |"
            echo ""
            echo "> Windows core zips contain executables only: \`phantomxd\`, \`phantomx-cli\`, \`phantomx-poi\`, \`phantomx-wallet\`, \`phantomx-pool\`."
            echo ""
            echo "### Qt builds"
            echo ""
            echo "| Build | Artifact | Contents |"
            echo "|---|---|---|"
            echo "| qt-windows-x64-release | \`qt-windows-x64-release\` | Windows installer (\`.exe\`) |"
            echo "| qt-linux-x86_64-release | \`qt-linux-x86_64-release\` | \`.tar.gz\` |"
            echo "| qt-linux-arm64-release | \`qt-linux-arm64-release\` | \`.tar.gz\` |"
            echo "| qt-macos-intel-release | \`qt-macos-intel-release\` | \`.tar.gz\` |"
          } >> "$GITHUB_STEP_SUMMARY"
